# The disc ships no .map file, so symbols come from analysis only.

# Linker generation confirmed as GC 1.0 to 2.6, from the exception runtime:
#
#   GetR2__Fv             .text:0x801B9C94  size 0x8   (absent on GC 2.7+)
#   __fini_cpp_exceptions .text:0x801B9C9C  size 0x34
#   __init_cpp_exceptions .text:0x801B9CD0  size 0x40  (0x3C on GC 2.7+)
#
# That rules out 11 and 14. configure.py assumes a GC/1.3.2 linker, so 10.
#   8  = CW for GameCube 1.0+
#   10 = CW for GameCube 1.3.2+
#   11 = CW for GameCube 2.7+
#   14 = CW for GameCube 3.0a3+
mw_comment_version: 10

# This tail is contiguous with the separately retained first word of the
# retail resource table, but no relocation points at the tail itself.
force_active:
  - lbl_8028D0F0

