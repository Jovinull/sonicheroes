name: Public QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-tests:
    name: public tool tests (Ubuntu 24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Run the complete public test suite
        run: python -m unittest discover -s tools -p "test_*.py" -t . -q

      - name: Check post-processor safety
        run: python tools/check_post_processors.py
