name: Build

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  private_build:
    name: private build (${{ matrix.version }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Approval protects the package credentials before any submitted code can run.
    #
    # A push does not need it. "Protect Main" requires a pull request to move
    # main and lists no bypass actors, so a push is always a merge of commits
    # whose build was approved on the pull request. Asking twice left every
    # merge parked on a review nobody was waiting to give, which hides a real
    # failure among the ones nobody clicked.
    #
    # private-build-auto carries the same credentials with no reviewer, and is
    # restricted to the main branch. That restriction is the load-bearing part.
    # A pull request runs the workflow from its own head branch, so naming the
    # unreviewed environment is something any branch could do; the branch policy
    # is what refuses it. What guards /orig is the credential being reachable
    # only from a gated or main-only environment, not the approval click.
    environment: ${{ github.event_name == 'pull_request' && 'private-build' || 'private-build-auto' }}
    container:
      image: ghcr.io/jovinull/sonicheroes-build:main
      credentials:
        username: ${{ secrets.GHCR_USERNAME }}
        password: ${{ secrets.GHCR_TOKEN }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [G9SE8P]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/a42a069bc755f0fa81316965335cb33dbf22a968/git-restore-mtime \
            --merge --commit-time

    - name: Prepare
      run: cp -a /orig .

    - name: Cache build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    - name: Build
      run: |
        # Cached DTK output is timestamp-based. Force the split inputs newer so
        # new or renamed translation units cannot be omitted by a stale
        # build/${{ matrix.version }}/config.json restored from another SHA.
        touch config/${{ matrix.version }}/config.yml \
            config/${{ matrix.version }}/splits.txt
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja build/${{ matrix.version }}/config.json
        python -m unittest tools.test_check_language_policy
        python tools/check_language_policy.py
        python -m unittest tools.test_check_post_processors
        python tools/check_post_processors.py
        ninja all_source progress build/${{ matrix.version }}/report.json

    # The `progress` target already reaches this through build/<version>/ok, so
    # a mismatch fails the step above. That guarantee is a dependency edge, not
    # a line anyone reads: if `progress` ever stops depending on `ok`, the byte
    # comparison disappears silently and every build still looks green.
    #
    # So state it. Hashing eighteen artifacts costs about a second, and this
    # fails independently of what the ninja graph happens to look like.
    - name: Verify the artifacts match retail
      run: |
        build/tools/dtk shasum -c config/${{ matrix.version }}/build.sha1

    - name: Upload map
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    - name: Upload report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

  # Informational for now: not in the required status checks. objdiff-cli's
  # report/report-changes plumbing (baseline.json, changes_fmt.py) already
  # existed for local use before this job; this just points it at the last
  # successful main build instead of a manually-created local snapshot.
  #
  # A per-function match percentage moving backward inside a still-NonMatching
  # unit is invisible to the SHA-1 check below: that unit's compiled source
  # isn't linked into the compared artifacts yet, so nothing there catches a
  # claimed improvement that was actually a regression. This job is the check
  # for that specific gap, not a replacement for the SHA-1 verification.
  progress_report:
    name: match progress vs main (G9SE8P)
    if: github.event_name == 'pull_request' && needs.private_build.result == 'success'
    needs: private_build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: |
          tools
          configure.py

    - name: Download this run's report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: G9SE8P_report
        path: build/G9SE8P

    - name: Download objdiff-cli
      run: |
        tag=$(sed -n 's/^config\.objdiff_tag = "\(.*\)"$/\1/p' configure.py)
        python3 tools/download_tool.py objdiff-cli build/tools/objdiff-cli --tag "$tag"

    - name: Find the latest successful main-branch build
      id: baseline
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --branch main --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')
        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        if [ -z "$run_id" ]; then
          echo "::warning::No successful main-branch build found yet (first run, or its report artifact expired); skipping the match regression check."
        fi

    - name: Download the main-branch baseline report
      if: steps.baseline.outputs.run_id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: G9SE8P_report
        run-id: ${{ steps.baseline.outputs.run_id }}
        github-token: ${{ github.token }}
        path: build/G9SE8P/baseline

    - name: Compare match progress against main
      if: steps.baseline.outputs.run_id != ''
      run: |
        mv build/G9SE8P/baseline/report.json build/G9SE8P/baseline.json
        build/tools/objdiff-cli report changes --format json-pretty \
            build/G9SE8P/baseline.json build/G9SE8P/report.json \
            -o build/G9SE8P/report_changes.json

        python3 tools/changes_fmt.py build/G9SE8P/report_changes.json --all \
            -o build/G9SE8P/changes.md
        if [ -s build/G9SE8P/changes.md ]; then
          cat build/G9SE8P/changes.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No match progress changes detected." >> "$GITHUB_STEP_SUMMARY"
        fi

        regressions=$(python3 tools/changes_fmt.py build/G9SE8P/report_changes.json)
        if [ -n "$regressions" ]; then
          echo "::error::Match regressions detected against main:"
          echo "$regressions"
          exit 1
        fi

  build_gate:
    name: build (G9SE8P)
    if: always()
    needs: private_build
    runs-on: ubuntu-latest
    steps:
    - name: Reject untrusted private-input build
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      run: |
        echo "::error::Fork pull requests cannot run with the private original-game build inputs."
        echo "::error::A maintainer must review the commits and test them from a repository-owned integration branch."
        exit 1

    - name: Require successful private build
      if: needs.private_build.result != 'success'
      run: |
        echo "::error::The private G9SE8P build did not complete successfully."
        exit 1

    - name: Confirm private build
      if: needs.private_build.result == 'success'
      run: echo "The private G9SE8P build completed successfully."
